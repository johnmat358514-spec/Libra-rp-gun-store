<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ammu-Nation #15 | Bulk Orders</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#f3f5fa}main{max-width:1050px;margin:auto;padding:26px 16px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}h1{margin:0;font-size:clamp(23px,4vw,36px)}h2{margin:0 0 18px;font-size:20px}.muted,small{color:#9aa7b8}.tag{color:#80edbd;background:#133b31;border:1px solid #28634f;border-radius:25px;padding:8px 12px;font-size:13px}.panel{background:#151d2a;border:1px solid #2b3749;border-radius:16px;padding:22px;margin:16px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:720px){.layout{grid-template-columns:1fr}header{align-items:flex-start}.panel{padding:17px}}label{display:block;margin:15px 0 8px;color:#c9d2df;font-size:14px}select,input,button{font:inherit;border-radius:9px}select,input{width:100%;background:#0e1521;color:white;border:1px solid #425066;padding:12px}button{background:#29bc8a;color:#08150f;border:0;font-weight:700;padding:12px 16px;cursor:pointer}button:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#27354a;color:#e9f0fa}.danger{background:#44232c;color:#ffc6c6}.controls{display:flex;gap:10px;align-items:center}.controls input{text-align:center}.controls button{min-width:45px}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:13px 0}.price{font-size:30px;color:#65e4b2;font-weight:800}.cart-row{border-top:1px solid #2b3749;padding:14px 0}.cart-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.cart-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}.cart-bottom .controls{max-width:200px}.cart-bottom .controls button{min-width:34px;padding:8px}.cart-bottom input{padding:8px}.notice{padding:11px 13px;border-radius:8px;background:#3b2c1b;color:#ffdba5;margin:12px 0}.ok{background:#153b2f;color:#9cf1cd}.full{width:100%;margin-top:10px}.footer{text-align:center;margin-top:22px;font-size:12px;color:#92a0b2}#status{min-height:22px;color:#80edbd;font-size:13px}</style></head><body><main><header><div><h1>AMMU-NATION #15</h1><div class="muted">Sandy Shores · Map 1 · Bulk Order Calculator</div></div><span class="tag">BULK PRICING</span></header><section class="panel"><label for="customer">Customer category</label><select id="customer"><option value="clan">Clan & Cartel</option><option value="reseller">Reseller</option></select><p class="muted" id="requirements"></p></section><div class="layout"><section class="panel"><h2>Add Items</h2><label for="item">Select product</label><select id="item"></select><div class="summary"><span class="muted">Unit price</span><strong id="unit"></strong></div><label for="qty">Quantity to add</label><div class="controls"><button class="secondary" id="decrease" aria-label="Decrease quantity">−</button><input id="qty" type="number" min="1" step="1" value="1"><button class="secondary" id="increase" aria-label="Increase quantity">+</button></div><div class="summary"><span class="muted">Subtotal</span><strong id="subtotal"></strong></div><button class="full" id="add">Add to Cart</button><p id="status" role="status"></p></section><section class="panel"><h2>Shopping Cart <span id="count" class="muted"></span></h2><div id="cart"></div><div id="moq"></div><div class="summary"><strong>Grand Total</strong><span class="price" id="total">$0.00</span></div><button class="full" id="copy">Copy Complete Order</button><button class="full secondary" id="download">Download Order (.txt)</button><button class="full danger" id="clear">Clear Cart</button></section></div><div class="footer">Prices subject to store confirmation. Minimum quantities apply to each product category included in the order. No payment is collected on this website.</div></main><script>
const products=[['Advanced Rifle',4200,3920,'gun'],['AK-47',1764,1646.40,'gun'],['Bullpup Rifle',3504,3270.40,'gun'],['Sniper Rifle',5244,4894.40,'gun'],['Double Barrel Shotgun',3504,3270.40,'gun'],['Pump Shotgun',3156,2945.60,'gun'],['Sawed-Off Shotgun',3260.40,3043.04,'gun'],['SMG',2460,2296,'gun'],['AP Pistol',1068,996.80,'gun'],['Pistol',720,672,'gun'],['Revolver',2112,1971.20,'gun'],['Vintage Pistol',1068,996.80,'gun'],['Flare Ammo',2.33,2.18,'ammo'],['LMG Ammo',14.16,13.22,'ammo'],['Pistol Ammo',3.72,3.47,'ammo'],['Revolver Ammo',7.20,6.72,'ammo'],['Rifle Ammo',3.72,3.47,'ammo'],['Shotgun Ammo',7.20,6.72,'ammo'],['SMG Ammo',3.72,3.47,'ammo'],['Sniper Ammo',8.94,8.34,'ammo'],['Body Armor',1566,1461.60,'other'],['Flare Gun',198,184.80,'gun']];
const $=id=>document.getElementById(id),money=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});let cart=[];const price=i=>products[i][$('customer').value==='clan'?1:2],minimum=type=>type==='gun'?($('customer').value==='clan'?10:50):($('customer').value==='clan'?5000:10000),step=()=>products[+$('item').value][3]==='ammo'?100:1;function quantity(){return Number($('qty').value)}function validQty(n){return Number.isSafeInteger(n)&&n>0&&n<=1000000}function renderSelection(){let i=+$('item').value;$('unit').textContent=money(price(i));$('subtotal').textContent=validQty(quantity())?money(price(i)*quantity()):'—';$('add').disabled=!validQty(quantity())}function render(){renderSelection();$('requirements').textContent=`MOQ: ${minimum('gun')} guns · ${minimum('ammo').toLocaleString()} ammo rounds (applies when that category is ordered)`;$('count').textContent=`(${cart.length} items)`;$('cart').replaceChildren();let totals={gun:0,ammo:0,other:0},sum=0;cart.forEach(({i,q})=>{let p=products[i];totals[p[3]]+=q;sum+=price(i)*q;let row=document.createElement('div');row.className='cart-row';let top=document.createElement('div');top.className='cart-top';let name=document.createElement('strong');name.textContent=p[0];let remove=document.createElement('button');remove.className='danger';remove.textContent='Remove';remove.onclick=()=>{cart=cart.filter(x=>x.i!==i);render()};top.append(name,remove);let bottom=document.createElement('div');bottom.className='cart-bottom';let controls=document.createElement('div');controls.className='controls';let minus=document.createElement('button');minus.className='secondary';minus.textContent='−';let field=document.createElement('input');field.type='number';field.min='1';field.value=q;field.setAttribute('aria-label','Quantity for '+p[0]);let plus=document.createElement('button');plus.className='secondary';plus.textContent='+';const change=n=>{if(n<=0){cart=cart.filter(x=>x.i!==i)}else if(validQty(n)){cart.find(x=>x.i===i).q=n}else return;render()};minus.onclick=()=>change(q-(p[3]==='ammo'?100:1));plus.onclick=()=>change(q+(p[3]==='ammo'?100:1));field.onchange=()=>{let n=Number(field.value);if(validQty(n))change(n);else render()};controls.append(minus,field,plus);let amount=document.createElement('strong');amount.textContent=money(price(i)*q);bottom.append(controls,amount);row.append(top,bottom);$('cart').append(row)});if(!cart.length){let p=document.createElement('p');p.className='muted';p.textContent='Your cart is empty. Add products to start an order.';$('cart').append(p)}let missing=[];if(totals.gun>0&&totals.gun<minimum('gun'))missing.push(`${minimum('gun')-totals.gun} more guns`);if(totals.ammo>0&&totals.ammo<minimum('ammo'))missing.push(`${(minimum('ammo')-totals.ammo).toLocaleString()} more ammo rounds`);$('moq').replaceChildren();if(cart.length){let note=document.createElement('div');note.className='notice'+(!missing.length?' ok':'');note.textContent=missing.length?'MOQ not met: add '+missing.join(' and '):'Minimum order requirements met';$('moq').append(note)}$('total').textContent=money(sum);$('copy').disabled=$('download').disabled=!cart.length||missing.length>0;return {totals,sum,eligible:cart.length>0&&!missing.length}}
function quote(){let sum=cart.reduce((s,x)=>s+price(x.i)*x.q,0);return ['AMMU-NATION #15 — BULK ORDER','Sandy Shores | Map 1','Customer: '+($('customer').value==='clan'?'Clan & Cartel':'Reseller'),' ',...cart.map(x=>`${products[x.i][0]} | ${x.q.toLocaleString()} × ${money(price(x.i))} = ${money(price(x.i)*x.q)}`),' ','TOTAL: '+money(sum),'Contact Ammu-Nation #15 to confirm availability.'].join('\n')}
for(const [type,label] of [['gun','WEAPONS'],['ammo','AMMUNITION'],['other','OTHER ITEMS']]){let group=document.createElement('optgroup');group.label=label;products.forEach((p,i)=>{if(p[3]===type){let opt=document.createElement('option');opt.value=i;opt.textContent=p[0];group.append(opt)}});$('item').append(group)}$('customer').onchange=()=>{cart=[];render();$('status').textContent='Customer category changed; cart reset.'};$('item').onchange=()=>{$('qty').value=products[+$('item').value][3]==='ammo'?1000:1;renderSelection()};$('qty').oninput=renderSelection;$('decrease').onclick=()=>{$('qty').value=Math.max(1,(validQty(quantity())?quantity():1)-step());renderSelection()};$('increase').onclick=()=>{$('qty').value=(validQty(quantity())?quantity():0)+step();renderSelection()};$('add').onclick=()=>{let i=+$('item').value,q=quantity();if(!validQty(q))return;let existing=cart.find(x=>x.i===i);if(existing){if(!validQty(existing.q+q))return;existing.q+=q}else cart.push({i,q});$('status').textContent=products[i][0]+' added to cart.';render()};$('clear').onclick=()=>{cart=[];$('status').textContent='Cart cleared.';render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(quote());$('status').textContent='Order copied!'}catch(e){$('status').textContent='Copy unavailable. Use Download Order instead.'}};$('download').onclick=()=>{let blob=new Blob([quote()],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ammu-nation-order.txt';a.click();URL.revokeObjectURL(url)};render();
</script></body></html>
